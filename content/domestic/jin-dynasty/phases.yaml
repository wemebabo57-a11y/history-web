phases:
  - id: founding
    label: 开国
    years: 1115年~1127年
    intro: 完颜阿骨打建金，联宋夹攻灭辽，靖康之变灭北宋，金朝在十二年间从东北部族一跃为中原大国。本章读灭辽与靖康条，注意同一事件在辽组与宋组是灭亡章，在金组是开国章，同一史实、不同视角。
  - id: golden
    label: 盛世
    years: 1141年~1189年
    intro: 绍兴和议后南北对峙稳定，世宗大定之治是金朝的鼎盛：汉制与猛安谋克并行，科举与女真文字教育皆达高点。说岳系金兀术形象放在本章作演绎对照，正史的完颜宗弼与话本的金兀术不是同一个人设。
  - id: decline
    label: 衰败
    years: 1211年~1232年
    intro: 蒙古南侵，野狐岭大败、中都陷落，宣宗南迁汴京，金朝陷入蒙古与南宋的两线作战，1232年三峰山主力覆没。本章是本次新增的补缺条目，补上了原来只有和议与蔡州、没有衰败过程的缺口。
  - id: fall
    label: 灭亡
    years: 1232年~1234年
    intro: 三峰山既是衰败的终点，也是灭亡的序幕：汴京陷落，蒙宋联合围攻蔡州，哀宗自缢、末帝死难，金亡。金朝自1115年至1234年，共一百一十九年。
    note: 三峰山之战在衰败章详述，灭亡章从蔡州围城接续，两章衔接处请注意年份重叠。

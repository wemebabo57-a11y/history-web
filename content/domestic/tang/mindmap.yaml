timeline_mindmap:
  root: "唐朝·大事分期"
  branches:
    - label: "前期"
      nodes:
        - label: "李渊长安称帝建唐"
          year: "618"
          note: "受隋恭帝禅,改元武德."
        - label: "玄武门之变,李世民即位"
          year: "626"
          note: "太宗即位,次年改元贞观,传说演绎见民间条目."
        - label: "贞观之治开始"
          year: "627"
          note: "轻徭薄赋,纳谏用人,详见官方条目."
        - label: "武则天立为皇后"
          year: "655"
          note: "高宗朝政渐移,垂帘之始,评价争议."
        - label: "武则天称帝建周"
          year: "690"
          note: "国号周,705神龙政变复唐,详见官方条目."
    - label: "中期"
      nodes:
        - label: "李隆基即位,开元盛世"
          year: "712"
          note: "姚宋为相,极盛之世,详见综述."
        - label: "怛罗斯之战唐军败于大食"
          year: "751"
          note: "西域形势转折一说,影响程度存争议."
        - label: "安史之乱爆发"
          year: "755"
          note: "安禄山范阳起兵,两京陷落,详见官方条目."
        - label: "马嵬之变,玄宗让位肃宗"
          year: "756"
          note: "杨贵妃死于马嵬,结局存争议,见民间条目."
        - label: "吐蕃陷长安,唐代宗幸陕"
          year: "763"
          note: "安史甫平边患又起,藩镇格局渐成."
    - label: "后期"
      nodes:
        - label: "两税法颁行"
          year: "780"
          note: "杨炎建议,以资产户等定税,详见官方条目."
        - label: "甘露之变,宦官尽杀朝官"
          year: "835"
          note: "文宗与李训郑注谋诛宦官事泄,宦官擅权更固."
        - label: "黄巢起义爆发"
          year: "875"
          note: "王仙芝黄巢先后起事,转战南北,880陷长安建大齐."
        - label: "黄巢败死,朱温降唐为宣武节度使"
          year: "884"
          note: "唐基已摇,藩镇混战,朱温渐强."
        - label: "朱温篡唐建梁,唐亡"
          year: "907"
          note: "哀帝禅位,五代之始."

phases:
  - id: founding
    label: 开国
    years: 617年~626年
    intro: 李渊太原起兵，618年称帝建唐，十年统一战争平定十余家割据，虎牢关之战是决定性一战。本章是本次新增的补缺条目，补上了原来只有贞观条、没有建唐过程的缺口；玄武门传说放在本章作史料与演绎之别的对照。
  - id: golden
    label: 盛世
    years: 627年~741年
    intro: 贞观之治与开元盛世是唐朝的两座高峰，中间的武周改朝是盛世内部的插曲：改朝而未改唐制底色，神龙复辟后唐朝仍续。读本章时请把武周看作盛世的一段插曲，而不是衰败的起点。
  - id: decline
    label: 衰败
    years: 751年~780年
    intro: 怛罗斯之战是安史前夜的信号，安史之乱动摇了唐朝的均田与府兵根基，两税法是衰败中的制度自救：以资产定税，承认了均田制的瓦解。杨贵妃马嵬结局传说放在本章作对照。
  - id: fall
    label: 灭亡
    years: 875年~907年
    intro: 黄巢起义席卷南北，唐朝中央再也无力恢复，907年朱温篡唐，唐亡，五代十国开始。

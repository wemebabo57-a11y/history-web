# 唐朝大事年表,至少14条.
period_id: tang
timeline:
  - year: 618
    event: 李渊长安称帝建唐
    note: 受隋恭帝禅,改元武德.
  - year: 626
    event: 玄武门之变,李世民即位
    note: 太宗即位,次年改元贞观,传说演绎见民间条目.
  - year: 627
    event: 贞观之治开始
    end_year: 649
    note: 轻徭薄赋,纳谏用人,详见官方条目.
  - year: 655
    event: 武则天立为皇后
    note: 高宗朝政渐移,垂帘之始,评价争议.
  - year: 690
    event: 武则天称帝建周
    end_year: 705
    note: 国号周,705神龙政变复唐,详见官方条目.
  - year: 712
    event: 李隆基即位,开元盛世
    end_year: 741
    note: 姚宋为相,极盛之世,详见综述.
  - year: 751
    event: 怛罗斯之战唐军败于大食
    note: 西域形势转折一说,影响程度存争议.
  - year: 755
    event: 安史之乱爆发
    end_year: 763
    note: 安禄山范阳起兵,两京陷落,详见官方条目.
  - year: 756
    event: 马嵬之变,玄宗让位肃宗
    note: 杨贵妃死于马嵬,结局存争议,见民间条目.
  - year: 763
    event: 吐蕃陷长安,唐代宗幸陕
    note: 安史甫平边患又起,藩镇格局渐成.
  - year: 780
    event: 两税法颁行
    note: 杨炎建议,以资产户等定税,详见官方条目.
  - year: 835
    event: 甘露之变,宦官尽杀朝官
    note: 文宗与李训郑注谋诛宦官事泄,宦官擅权更固.
  - year: 875
    event: 黄巢起义爆发
    end_year: 884
    note: 王仙芝黄巢先后起事,转战南北,880陷长安建大齐.
  - year: 884
    event: 黄巢败死,朱温降唐为宣武节度使
    note: 唐基已摇,藩镇混战,朱温渐强.
  - year: 907
    event: 朱温篡唐建梁,唐亡
    note: 哀帝禅位,五代之始.
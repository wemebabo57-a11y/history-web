phases:
  - id: founding
    label: 开国
    years: 916年~938年
    intro: 耶律阿保机建国称帝，辽朝立国，石敬瑭割燕云十六州使辽朝第一次据有中原农耕区。辽与宋并立的二百年，自燕云十六州开始。
  - id: golden
    label: 盛世
    years: 982年~1042年
    intro: 萧太后摄政、圣宗亲政，重熙年间辽朝达到鼎盛，澶渊之盟后宋辽百年和平，岁币换来的不只是和平，还有辽朝内部制度的稳定。萧太后与杨家将故事中的辽放在本章作演绎对照。
  - id: decline
    label: 衰败
    years: 1055年~1115年
    intro: 道宗朝吏治败坏、耶律乙辛专权，东北的女真完颜部却在悄然统一诸部，辽金力量对比逆转。本章是本次新增的补缺条目，补上了原来只有盛世与辽亡、没有衰败过程的缺口。
  - id: fall
    label: 灭亡
    years: 1115年~1125年
    intro: 阿骨打建金，辽军连败，天祚帝西逃被俘，辽亡。辽朝自916年至1125年，共二百零九年。

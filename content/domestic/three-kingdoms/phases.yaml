phases:
  - id: founding
    label: 开国
    years: 208年~229年
    intro: 三国不是单一王朝，本组以魏蜀吴鼎立整体分期。赤壁之战划出三分雏形，220年曹丕代汉、221年刘备建汉、229年孙权建吴，三国鼎立完成。本章读赤壁与鼎立两条。
  - id: golden
    label: 盛世
    years: 221年~234年
    intro: 三国没有大一统盛世，本章以鼎立定型为相对高点：夷陵之战后三国边界大体稳定，诸葛亮北伐是蜀汉最后的进取。空城计传说放在本章作演绎对照，它不是史实，却是后世诸葛亮形象的核心。
    note: 本章的相对高点只指三国鼎立的稳定期，不作一统盛世的暗示。
  - id: decline
    label: 衰败
    years: 249年~265年
    intro: 高平陵之变后司马氏掌握曹魏军政，魏蜀吴的鼎立格局从内部被打破。衰败的起点不在边疆，而在曹魏中枢的权力转移。
  - id: fall
    label: 灭亡
    years: 263年~280年
    intro: 263年魏灭蜀，265年司马炎代魏建晋，280年晋灭吴，三国归晋。本章与衰败章时间交错：灭蜀发生在代魏之前，归晋是三国时代的终点。
    note: 263年魏灭蜀已是灭亡序幕，与衰败章的高平陵时间交错，按政权归属分章。

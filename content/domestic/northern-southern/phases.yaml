phases:
  - id: founding
    label: 开国
    years: 383年~439年
    intro: 南北朝不是单一王朝，本组以南北格局的形成为线：淝水之战定下南北分立，420年刘裕建宋，439年北魏统一北方，南北对峙自此定型。本章的建宋与北魏统一条是本次新增的补缺条目。
  - id: golden
    label: 盛世
    years: 420年~499年
    intro: 南朝的元嘉之治与北朝的孝文改革，是南北朝各自的高点：一个在南方的休养生息与北伐之间摇摆，一个以迁都洛阳、改汉姓服饰重塑北魏。本章与开国章时间交错，刘宋建国与元嘉之治本就紧相衔接。
    note: 元嘉之治的年份与开国章的刘宋建国相衔接，分章只按格局形成与治世内容区分。
  - id: decline
    label: 衰败
    years: 534年~577年
    intro: 北魏分裂为东西魏，北周北齐对峙，侯景之乱重创南朝，木兰从军的传说放在本章作乱世从军的民间对照。南北朝的衰败不是一朝的衰败，而是南北两个序列同时内耗的过程。
  - id: fall
    label: 灭亡
    years: 589年
    intro: 隋灭陈，南北统一，南北朝时代结束。本章只有一年的终点，却是隋朝开国章的起点。

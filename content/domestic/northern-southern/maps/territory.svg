  <circle cx="360" cy="232" r="5" fill="#111" stroke="#fff" stroke-width="1.5"/><text x="369" y="236" font-size="12" font-weight="bold" text-anchor="start">洛阳</text>
  <circle cx="330" cy="180" r="5" fill="#111" stroke="#fff" stroke-width="1.5"/><text x="339" y="184" font-size="12" font-weight="bold" text-anchor="start">平城·北魏旧都</text>
  <circle cx="525" cy="310" r="5" fill="#111" stroke="#fff" stroke-width="1.5"/><text x="516" y="314" font-size="12" font-weight="bold" text-anchor="end">建康·南朝都</text>
  <g>
    <line x1="335" y1="188" x2="355" y2="224" stroke="#111" stroke-width="2" marker-end="none"/>

  <line x1="110" y1="288" x2="575" y2="268" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="420" y="260" font-size="11" fill="#7b241c">淮河—秦岭分界(示意)</text>
<path d="M130,190 C200,170 240,200 300,195 C360,190 380,220 430,215 C480,210 520,190 565,200" fill="none" stroke="#2f80ed" stroke-width="3"/>

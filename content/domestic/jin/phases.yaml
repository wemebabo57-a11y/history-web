phases:
  - id: founding
    label: 开国
    years: 249年~265年
    intro: 晋朝的开国不在战场，而在洛阳中枢：高平陵之变后司马氏十六年间层层递进，265年司马炎受禅称帝，西晋建立。本章是本次新增的补缺条目，补上了原来只有太康条、没有代魏过程的缺口。
  - id: golden
    label: 盛世
    years: 265年~290年
    intro: 太康统一与太康之治是西晋唯一的盛世：280年灭吴完成统一，太康年间人口、田亩、赋税皆有恢复，石崇王恺斗富的传说放在本章作对照，盛世下的奢靡已是隐患的先兆。
  - id: decline
    label: 衰败
    years: 291年~383年
    intro: 八王之乱耗尽西晋元气，永嘉之乱迫使衣冠南渡，东晋在门阀政治下偏安江左。淝水之战放在本章：它是偏安政权最亮的一仗，却没有改变门阀与北府兵的格局，故不归入盛世章。
  - id: fall
    label: 灭亡
    years: 404年~420年
    intro: 刘裕起兵讨平桓玄，两次北伐收复山东与关中却未能久守，420年代晋建宋，东晋亡。本章是本次新增的补缺条目，补上了原来东晋有偏安条、没有亡国条的缺口。

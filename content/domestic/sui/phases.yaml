phases:
  - id: founding
    label: 开国
    years: 581年~589年
    intro: 杨坚代周建隋，589年灭陈，南北分裂一百七十年后重新统一。本章读隋灭陈条，开皇制度条因其制度面是盛世内容，归入下一章详读。
  - id: golden
    label: 盛世
    years: 581年~604年
    intro: 开皇之治是隋朝的鼎盛：均田制、租庸调制、府兵制与科举滥觞，皆在开皇年间定型，为唐朝继承。本章读开皇制度与开皇之治两条。
  - id: decline
    label: 衰败
    years: 605年~610年
    intro: 大运河与东都洛阳是隋朝最宏大的工程，也是衰败的起点：工程本身沟通南北、利在后世，但征发之重、修建之急，使民怨在炀帝朝迅速积聚。隋炀帝奢靡传闻放在本章作考辨对照，野史的夸张与正史的苛政要分开看。
  - id: fall
    label: 灭亡
    years: 612年~618年
    intro: 三征辽东耗尽国力，江都之变炀帝被杀，隋朝仅三十八年而亡。本章是隋朝通读的终点，也是唐朝开国章的前夜。

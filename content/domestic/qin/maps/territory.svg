<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-label="秦前221年前后疆域示意图">
<title>秦·前221年前后疆域示意（自绘，非精确测绘）</title>
<desc>自绘示意：海洋/陆地底色、黄河长江曲线、秦疆域多边形、邻族方位、咸阳、长城线、指南针、比例尺示意。禁套现代省界国界，不作精确声称。</desc>
<!-- 海洋底色 -->
<rect x="0" y="0" width="720" height="540" fill="#cfe3f2"/>
<text x="660" y="300" font-size="15" fill="#5b8ab0" text-anchor="middle" transform="rotate(90 660 300)">东 海（示意）</text>
<text x="360" y="525" font-size="13" fill="#5b8ab0" text-anchor="middle">南 海（示意）</text>
<!-- 陆地底色（示意古陆块，不含现代边界） -->
<path d="M 90,120 L 180,80 L 310,66 L 440,84 L 540,128 L 590,200 L 575,280 L 535,345 L 455,405 L 345,435 L 215,425 L 120,375 L 68,285 L 62,185 Z" fill="#efe6cf" stroke="#8a7a5c" stroke-width="2"/>
<!-- 秦疆域多边形 -->
<path d="M 235,190 L 330,165 L 430,175 L 490,210 L 505,250 L 455,290 L 410,335 L 320,350 L 240,320 L 200,265 L 205,215 Z" fill="#d9a05f" fill-opacity="0.78" stroke="#8b4513" stroke-width="2.5"/>
<text x="330" y="262" font-size="17" font-weight="bold" fill="#5a2d0c" text-anchor="middle">秦 疆 域（示意）</text>
<text x="330" y="282" font-size="12" fill="#5a2d0c" text-anchor="middle">前221年统一前后 · 非精确</text>
<!-- 七雄故地小字（统一示意） -->
<g font-size="11" fill="#6b4423">
<text x="285" y="230">秦故地·关中</text>
<text x="345" y="248">韩魏故地·中原</text>
<text x="300" y="200">赵故地·北</text>
<text x="410" y="205">燕故地·东北</text>
<text x="445" y="245">齐故地·东</text>
<text x="350" y="315">楚故地·南</text>
</g>
<!-- 黄河 -->
<path d="M 175,125 C 235,140 265,155 255,195 C 247,228 300,245 350,232 C 400,219 450,225 505,245" fill="none" stroke="#4a90c2" stroke-width="3"/>
<text x="480" y="222" font-size="12" fill="#2f6b9a">黄河（示意）</text>
<!-- 长江 -->
<path d="M 175,310 C 255,298 335,308 415,296 C 465,288 520,296 562,312" fill="none" stroke="#4a90c2" stroke-width="3"/>
<text x="485" y="292" font-size="12" fill="#2f6b9a">长江（示意）</text>
<!-- 长城线 -->
<polyline points="205,172 280,150 360,143 445,158" fill="none" stroke="#6b4a2f" stroke-width="3.5" stroke-dasharray="10,4"/>
<g font-size="12" fill="#4a2f18"><text x="262" y="138">秦长城线（示意）</text></g>
<!-- 都城咸阳 -->
<circle cx="308" cy="243" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/>
<text x="318" y="238" font-size="13" font-weight="bold" fill="#c0392b">咸阳</text>
<!-- 邻族方位 -->
<g font-size="12" fill="#555" font-style="italic">
<text x="300" y="100">匈奴 · 漠北方向</text>
<text x="470" y="140">东胡 · 东北方向</text>
<text x="90" y="220">西羌 · 西</text>
<text x="180" y="400">滇 · 夜郎 · 西南</text>
<text x="400" y="395">百越 · 岭南以南</text>
</g>
<!-- 指南针 -->
<g transform="translate(648,88)">
<circle r="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
<polygon points="0,-18 6,6 0,2 -6,6" fill="#c0392b"/>
<text y="-30" font-size="14" text-anchor="middle" fill="#333">北</text>
<text y="20" font-size="10" text-anchor="middle" fill="#333">南</text>
</g>
<!-- 比例尺（示意不按比例） -->
<g transform="translate(40,470)">
<rect x="0" y="0" width="60" height="6" fill="#333"/>
<rect x="60" y="0" width="60" height="6" fill="#fff" stroke="#333"/>
<text x="0" y="22" font-size="11" fill="#333">比例尺示意 · 不按比例</text>
</g>
<!-- 图例 -->
<g transform="translate(470,440)">
<rect x="0" y="0" width="210" height="78" fill="#fff" fill-opacity="0.92" stroke="#333"/>
<rect x="10" y="10" width="22" height="12" fill="#d9a05f" stroke="#8b4513"/>
<text x="38" y="20" font-size="11" fill="#333">秦疆域（示意）</text>
<line x1="10" y1="34" x2="32" y2="34" stroke="#6b4a2f" stroke-width="3" stroke-dasharray="10,4"/>
<text x="38" y="38" font-size="11" fill="#333">长城线</text>
<line x1="10" y1="52" x2="32" y2="52" stroke="#4a90c2" stroke-width="3"/>
<text x="38" y="56" font-size="11" fill="#333">黄河 / 长江</text>
<circle cx="21" cy="68" r="5" fill="#c0392b"/>
<text x="38" y="72" font-size="11" fill="#333">都城咸阳</text>
</g>
<text x="360" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#2c2c2c">秦 · 前221年前后疆域示意（自绘，非精确测绘）</text>
<text x="360" y="505" font-size="12" text-anchor="middle" fill="#333">CC0 自绘示意 · 不套用现代省界国界 · 四至见 dynasty.md 文字 · 示意非实测</text>
</svg>
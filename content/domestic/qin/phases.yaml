phases:
  - id: founding
    label: 开国
    years: 前221年
    intro: 秦由关中诸侯经商鞅变法而强，前221年嬴政并六国称皇帝，废分封、行郡县，大一统政权的骨架就此立起。本章读始皇本纪与李斯列传，看统一是怎样从战争胜利变成制度的。
  - id: golden
    label: 盛世
    years: 前221年~前210年
    intro: 秦没有汉唐式的长期盛世，本章以统一制度的完成为鼎盛：书同文、车同轨、统一度量衡货币与郡县两级制，皆在始皇在位十余年间推行。读本章时请注意，秦的鼎盛与高压是同一枚硬币的两面。
    note: 秦的盛世仅十余年，且与开国同年开始，分章只按制度面与开国面区分，不作长期繁荣的暗示。
  - id: decline
    label: 衰败
    years: 前213年~前209年
    intro: 焚书坑儒的争议、严刑峻法与大规模徭役，使统一的制度迅速失去人心。孟姜女传说放在本章作民间对照：它不是史料，却是后世对秦代徭役之重的集体记忆。
  - id: fall
    label: 灭亡
    years: 前209年~前207年
    intro: 陈胜吴广起义点火，巨鹿之战秦军主力覆没，子婴降刘邦，秦朝仅十五年而亡。本章是秦朝通读的终点，也是汉朝开国章的起点。

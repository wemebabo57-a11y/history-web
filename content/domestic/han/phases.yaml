phases:
  - id: founding
    label: 开国
    years: 前202年~前195年
    intro: 刘邦由布衣而天子，约法三章、休养生息，汉朝在秦末废墟上立国。本章读汉高祖本纪要录，看一个新王朝怎样在秦制的基础上换一套统治办法。
  - id: golden
    label: 盛世
    years: 前180年~前87年
    intro: 文景之治休养生息，汉武帝开边、定制度、通西域，丝路开通使汉朝的影响第一次越过葱岭。昭君出塞与张骞传说放在本章作民间对照，前者是和亲记忆，后者是丝路记忆。
  - id: decline
    label: 衰败
    years: 公元8年~57年
    intro: 王莽改制失败、绿林赤眉并起，西汉亡；光武帝再造东汉，是一次成功的中兴，却没有解决土地兼并与外戚宦官的结构问题。本章以王莽与光武两条为骨架，东汉中后期一百余年的外戚宦官之争在现有条目中未单独立条，是下一步补史料的方向。
    note: 衰败章的条目只到光武朝，东汉中后期至黄巾之间的具体条目尚缺，通读时请以光武中兴的局限作过渡。
  - id: fall
    label: 灭亡
    years: 184年~220年
    intro: 黄巾起义动摇了东汉的统治根基，州牧割据、军阀混战接踵而至，220年曹丕代汉，东汉亡，三国时代开始。

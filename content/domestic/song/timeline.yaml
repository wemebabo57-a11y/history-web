# 宋朝大事年表（至少12条；年份为传世纪年）
- {year: 960, event: 陈桥兵变，赵匡胤建宋，定都开封}
- {year: 979, event: 灭北汉，十国基本统一完成}
- {year: 1005, event: 澶渊之盟，宋辽议和纳岁币}
- {year: 1043, event: 仁宗盛治（咸平之治余绪）：范仲淹庆历新政（评价争议，见专文）}
- {year: 1069, event: 王安石熙宁变法开始}
- {year: 1084, event: 司马光《资治通鉴》传世称进呈（版本待考）}
- {year: 约北宋末, event: 清明上河图传世(画作真伪与年代多说并存,见专文)}
- {year: 1115, event: 女真建金；宋金海上之盟约夹攻辽}
- {year: 1127, event: 靖康之变，北宋亡；赵构南渡}
- {year: 1130, event: 钟相杨么起义（南方水乡起义，细节存疑）}
- {year: 1141, event: 绍兴和议；岳飞遇害（官书与传说须区分）}
- {year: 1161, event: 采石之战，虞允文抗金}
- {year: 1206, event: 韩侂胄开禧北伐}
- {year: 1234, event: 宋蒙联合灭金；端平入洛}
- {year: 1276, event: 元军陷临安}
- {year: 1279, event: 崖山海战，南宋亡}

phases:
  - id: founding
    label: 开国
    years: 960年~979年
    intro: 陈桥兵变后赵匡胤建宋，杯酒释兵权收回武将兵权，十九年间先后平定荆湖、后蜀、南汉、南唐、北汉，北宋统一大体完成。本章读宋太祖统一战争条。
  - id: golden
    label: 盛世
    years: 1004年~1126年
    intro: 宋朝没有汉唐式的武功盛世，本章以经济文化繁荣与变法努力为鼎盛：澶渊之盟换来百年和平，庆历新政与熙宁变法试图救弊，清明上河图与东京梦华录是东京繁华的风貌记录。杨家将传说放在本章作民间对照。
    note: 宋的鼎盛指经济文化与制度探索，不作武功盛世的暗示。
  - id: decline
    label: 衰败
    years: 1125年~1141年
    intro: 靖康之变是北宋之亡，对全宋而言是衰败章的转折：徽钦被掳、北方尽失，南宋在绍兴和议后偏安江南，岳飞遇害是偏安政治的另一面。本章读靖康与绍兴两条，岳飞传说作对照。
  - id: fall
    label: 灭亡
    years: 1276年~1279年
    intro: 蒙古南下，临安陷落，崖山海战后宋室遗臣蹈海，南宋亡。宋朝自960年至1279年，共三百一十九年。

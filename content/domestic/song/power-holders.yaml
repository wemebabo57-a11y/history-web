- {name: 范仲淹, role: 庆历新政主持, period: 约1043—1045, note: 先天下之忧而忧语出其文（确知短句）}
- {name: 王安石, role: 神宗朝宰相变法, period: 1069—1076, birth_death: 1021—1086, note: 熙宁新法；与司马光党争}
- {name: 司马光, role: 旧党领袖，哲宗朝宰相, period: 1085—1086, birth_death: 1019—1086, note: 主持《资治通鉴》}
- {name: 蔡京, role: 徽宗朝宰相, period: 约1102—1125, note: 花石纲时权相，评价争议}
- {name: 高太后高滔滔, role: 哲宗朝垂帘, period: 1085—1093, note: 元祐更化}
- {name: 秦桧, role: 高宗朝宰相, period: 1131—1155, birth_death: 约1090—1155存疑, note: 主绍兴和议；岳飞案争议核心}
- {name: 韩侂胄, role: 宁宗朝权臣, period: 约1194—1207, note: 开禧北伐}
- {name: 史弥远, role: 宁宗理宗朝权相, period: 1208—1233, note: 废立济王争议}
- {name: 贾似道, role: 理宗度宗朝权相, period: 约1259—1275, birth_death: 约1213—1275存疑, note: 公田法；襄阳之战时误国之责争议}
- {name: 谢太后谢道清, role: 恭帝朝垂帘, period: 1274—1276, note: 临安陷落前决策}

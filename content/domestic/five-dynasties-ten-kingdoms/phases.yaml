phases:
  - id: founding
    label: 开国
    years: 907年~960年
    intro: 五代十国不是单一王朝，本组以中原五代为主线、十国并列。907年朱温篡唐建后梁，此后五十余年间后梁、后唐、后晋、后汉、后周走马灯般更迭，冯道历事五朝的传说放在衰败章作乱世生存的对照。
  - id: golden
    label: 盛世
    years: 954年~959年
    intro: 五代没有典型盛世，本章以后周世宗三征为相对高点：整军、练兵、三征淮南与北汉，为北宋统一打下基础。所谓盛世，在这里只是乱世中的一次中兴。
    note: 五代无典型盛世，本章以世宗中兴为相对高点，不作繁荣盛世的暗示。
  - id: decline
    label: 衰败
    years: 907年~979年
    intro: 石敬瑭割燕云十六州换取契丹支持，是五代最大的地缘代价；十国并立则是分裂的另一面：南方诸国各自偏安，中原政权无力统一。本章时间上与开国、盛世章交错，石敬瑭在世宗之前，按代价归入衰败章，通读时请注意时间顺序。
    note: 石敬瑭割燕云在时间上早于后周世宗，按分裂代价归入衰败章，通读时请注意时间交错。
  - id: fall
    label: 灭亡
    years: 960年~979年
    intro: 960年陈桥兵变，赵匡胤代周建宋，五代结束；十国余部到979年才尽归宋，五代十国时代至此完全终结。

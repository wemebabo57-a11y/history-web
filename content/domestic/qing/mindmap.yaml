          note: "天命汗,后金建国,追尊太祖,生卒约1559-1626存疑"
        - label: "皇太极"
          reign: "1626-1643"
          note: "天聪崇德,改号清,追尊太宗,生卒约1592-1643存疑"
        - label: "福临"
          extra: "世祖"
          reign: "1644-1661"
          note: "顺治入关首帝,出家传说标存疑见folk"
        - label: "玄烨"
          extra: "圣祖"

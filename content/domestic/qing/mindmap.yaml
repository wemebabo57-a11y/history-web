          note: "康熙,平三藩收台湾,生卒1654-1722"
        - label: "胤禛"
          extra: "世宗"
          reign: "1723-1735"
          note: "雍正,军机处设,继位传说争议见folk"
        - label: "弘历"
          extra: "高宗"
          reign: "1736-1795"
          note: "乾隆,盛世与闭关定制,生卒1711-1799"
        - label: "颙琰"
          extra: "仁宗"
          reign: "1796-1820"
          note: "嘉庆,诛和珅,白莲教"
        - label: "旻宁"
          extra: "宣宗"
          reign: "1821-1850"
          note: "道光,鸦片战争"
        - label: "奕詝"
          extra: "文宗"
          reign: "1851-1861"
          note: "咸丰,太平天国与英法联军"
        - label: "载淳"
          extra: "穆宗"
          reign: "1862-1874"
          note: "同治,慈禧垂帘实际掌权,中兴之说争议"
        - label: "载湉"
          extra: "德宗"
          reign: "1875-1908"
          note: "光绪,戊戌变法,慈禧垂帘实际掌权"
        - label: "溥仪"
          extra: "逊帝"
          reign: "1909-1912"
          note: "宣统,辛亥退位,生卒1906-1967约"
power_mindmap:
  root: "清朝·名义君主与实际掌权者"
  branches:
    - label: "权臣与实力人物（10人）"
      nodes:
        - label: "多尔衮"
          role: "摄政王"
          note: "称谓与功罪评价有争议｜清入关定都北京"
        - label: "鳌拜"
          role: "辅政大臣"
          note: "《清史稿》笔法与野史出入大｜辅政专权后被擒"
        - label: "吴三桂"
          role: "平西王"
          note: "降清动机系后世演绎,不作史料｜三藩之乱"
        - label: "和珅"
          role: "军机大臣"
          note: "家产数字传说夸大,标争议｜嘉庆诛贪"
        - label: "林则徐"
          role: "湖广总督钦差"
          note: "禁烟成效与开战责任多说并存｜虎门销烟"
        - label: "曾国藩"
          role: "湘军统帅"
          note: "功罪评价两极,不下结论｜镇压太平天国"
        - label: "李鸿章"
          role: "直隶总督北洋大臣"
          note: "卖国与务实两派并存｜洋务与马关议和"
        - label: "慈禧"
          role: "太后垂帘实际掌权者"
          note: "实际掌权1861-1908,评价争议极大｜洋务戊戌义和团诸政局"
        - label: "袁世凯"
          role: "北洋大臣民国大总统"
          note: "奸雄两极评价,不下结论｜小站练兵、逼清帝退位、洪宪称帝"
        - label: "奕䜣"
          role: "恭亲王总理衙门"
          note: "与慈禧关系说法并存｜洋务官办外交"
timeline_mindmap:
  root: "清朝·大事分期"
  branches:
    - label: "前期"
      nodes:
        - label: "后金建国"
          year: "1616"
          note: "努尔哈赤建国号金,统一女真"
        - label: "改号清"
          year: "1636"
          note: "皇太极改国号大清"
        - label: "清入关"
          year: "1644"
          note: "摄政王多尔衮率军入北京,顺治定都"
        - label: "扬州嘉定抗清屠城传闻"
          year: "1645-1646"
          note: "多方记载数字悬殊,标争议,详见folk条"
        - label: "康雍乾盛世"
          year: "1662-1795"
          note: "人口赋税边疆扩展,盛世实态有争议"
    - label: "中期"
      nodes:
        - label: "三藩之乱与平定"
          year: "1673-1681"
          note: "吴三桂等叛乱,康熙削藩平叛"
        - label: "收台湾与闭关定制"
          year: "1684-1757"
          note: "施琅平台湾,广州一口通商之说,起因多说并存"
        - label: "鸦片战争"
          year: "1840-1842"
          note: "虎门销烟后开战,南京条约赔款割地开埠"
        - label: "太平天国"
          year: "1851-1864"
          note: "金田起义,定都天京,湘淮军镇压,性质评价多派"
        - label: "洋务运动"
          year: "1861-1895"
          note: "师夷长技,官督商办,甲午战败受挫"
    - label: "后期"
      nodes:
        - label: "甲午战争"
          year: "1894-1895"
          note: "马关条约,割台赔款,洋务破产之说争议"
        - label: "戊戌变法"
          year: "1898"
          note: "百日维新,慈禧训政,光绪被幽,评价两极"
        - label: "义和团与八国联军"
          year: "1900"
          note: "扶清灭洋口号,辛丑条约,评价争议极大"
        - label: "辛亥革命与清帝退位"
          year: "1911-1912"
          note: "武昌起义,南北议和,宣统退位,帝制终结"
notes:
  - "垂帘／摄政附注：慈禧（1835约-1908约,存疑）与慈安垂帘1861-1873、同治亲政后慈禧再垂帘1875-1889、1898-1908训政,实际掌权近半世纪,评价争议极大,此处不下结论。"

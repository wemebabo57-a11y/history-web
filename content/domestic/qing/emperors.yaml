# 清朝皇帝系表(12帝含追尊,慈禧垂帘另注实际掌权)
period_id: qing
dynasty: 清朝
source_note: 主据《清史稿·本纪》(赵尔巽等,传世本,具体版本待考;页码待核,未能联网核验)
emperors:
  - { name: 努尔哈赤, reign: 1616-1626, note: 天命汗,后金建国,追尊太祖,生卒约1559-1626存疑 }
  - { name: 皇太极, reign: 1626-1643, note: 天聪崇德,改号清,追尊太宗,生卒约1592-1643存疑 }
  - { temple: 世祖, name: 福临, reign: 1644-1661, note: 顺治入关首帝,出家传说标存疑见folk }
  - { temple: 圣祖, name: 玄烨, reign: 1662-1722, note: 康熙,平三藩收台湾,生卒1654-1722 }
  - { temple: 世宗, name: 胤禛, reign: 1723-1735, note: 雍正,军机处设,继位传说争议见folk }
  - { temple: 高宗, name: 弘历, reign: 1736-1795, note: 乾隆,盛世与闭关定制,生卒1711-1799 }
  - { temple: 仁宗, name: 颙琰, reign: 1796-1820, note: 嘉庆,诛和珅,白莲教 }
  - { temple: 宣宗, name: 旻宁, reign: 1821-1850, note: 道光,鸦片战争 }
  - { temple: 文宗, name: 奕詝, reign: 1851-1861, note: 咸丰,太平天国与英法联军 }
  - { temple: 穆宗, name: 载淳, reign: 1862-1874, note: 同治,慈禧垂帘实际掌权,中兴之说争议 }
  - { temple: 德宗, name: 载湉, reign: 1875-1908, note: 光绪,戊戌变法,慈禧垂帘实际掌权 }
  - { temple: 逊帝, name: 溥仪, reign: 1909-1912, note: 宣统,辛亥退位,生卒1906-1967约 }
regent_note: 慈禧(1835约-1908约,存疑)与慈安垂帘1861-1873、同治亲政后慈禧再垂帘1875-1889、1898-1908训政,实际掌权近半世纪,评价争议极大,此处不下结论。

phases:
  - id: founding
    label: 开国
    years: 1644年~1683年
    intro: 清军入关定鼎，三藩之乱平定、施琅平台湾，康熙朝前期完成全国统一。扬州嘉定屠城传闻放在本章作争议对照，传闻与正史的界限请看条目内的争议节。
  - id: golden
    label: 盛世
    years: 1662年~1795年
    intro: 康雍乾盛世是清朝的鼎盛：一百三十余年间疆域达到极盛，人口、赋税、文化皆有增长，雍正继位传说放在本章作民间对照。盛世的另一面是闭关定制，见下一章。
  - id: decline
    label: 衰败
    years: 1684年~1864年
    intro: 闭关定制始于康熙年间，其负面效应在盛世后才充分显现，故归入衰败章作原因追溯；鸦片战争打开国门，太平天国动摇了清朝的统治根基，衰败自此公开化。
    note: 闭关定制始于盛世年间，负面效应在盛世后显现，归入衰败章作原因追溯，通读时请注意时间交错。
  - id: fall
    label: 灭亡
    years: 1861年~1912年
    intro: 洋务、戊戌、义和团与辛丑条约，是清朝最后五十年的自救与失败，1912年辛亥革命后清帝退位，清亡。清朝自1616年建国至1912年，共二百九十六年。

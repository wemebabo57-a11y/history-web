# 清朝大事年表(14条以上)
period_id: qing
source_note: 主据《清史稿》《清实录》(传世本,具体版本待考;页码待核,未能联网核验)
events:
  - { year: 1616, event: 后金建国, note: 努尔哈赤建国号金,统一女真 }
  - { year: 1636, event: 改号清, note: 皇太极改国号大清 }
  - { year: 1644, event: 清入关, note: 摄政王多尔衮率军入北京,顺治定都 }
  - { year: 1645-1646, event: 扬州嘉定抗清屠城传闻, note: 多方记载数字悬殊,标争议,详见folk条 }
  - { year: 1673-1681, event: 三藩之乱与平定, note: 吴三桂等叛乱,康熙削藩平叛 }
  - { year: 1684-1757, event: 收台湾与闭关定制, note: 施琅平台湾,广州一口通商之说,起因多说并存 }
  - { year: 1662-1795, event: 康雍乾盛世, note: 人口赋税边疆扩展,盛世实态有争议 }
  - { year: 1840-1842, event: 鸦片战争, note: 虎门销烟后开战,南京条约赔款割地开埠 }
  - { year: 1851-1864, event: 太平天国, note: 金田起义,定都天京,湘淮军镇压,性质评价多派 }
  - { year: 1861-1895, event: 洋务运动, note: 师夷长技,官督商办,甲午战败受挫 }
  - { year: 1894-1895, event: 甲午战争, note: 马关条约,割台赔款,洋务破产之说争议 }
  - { year: 1898, event: 戊戌变法, note: 百日维新,慈禧训政,光绪被幽,评价两极 }
  - { year: 1900, event: 义和团与八国联军, note: 扶清灭洋口号,辛丑条约,评价争议极大 }
  - { year: 1911-1912, event: 辛亥革命与清帝退位, note: 武昌起义,南北议和,宣统退位,帝制终结 }

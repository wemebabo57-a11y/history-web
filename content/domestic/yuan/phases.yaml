phases:
  - id: founding
    label: 开国
    years: 1206年~1279年
    intro: 成吉思汗统一蒙古建国，蒙古灭金、忽必烈建元、襄阳与崖山灭宋，七十三年间从高原部族到一统中国。本章是本次新增成吉思汗条的所在，建元灭宋既是开国完成也是盛世起点，归入开国章，盛世章从行省制展开。
  - id: golden
    label: 盛世
    years: 1260年~1320年
    intro: 行省制与宣政院辖吐蕃、海运漕粮供大都、延祐复科与元曲风貌，是元朝制度与文化的鼎盛。两征日本之败放在本章作阴影：极盛期的远征失败，预示了扩张的极限。
  - id: decline
    label: 衰败
    years: 1333年~1351年
    intro: 顺帝朝吏治败坏、脱脱改革失败、黄河连年决口，治河征发成为红巾起义的导火索。本章是本次新增的补缺条目，补上了原来只有盛世风貌与红巾灭亡、没有起义前夜的缺口。
  - id: fall
    label: 灭亡
    years: 1351年~1368年
    intro: 红巾起义席卷南北，朱元璋由红巾将领而建明，1368年明军克大都，元顺帝北走上都，元亡。月饼传信的传说放在本章作民间对照。

power_mindmap:
  root: "明朝·名义君主与实际掌权者"
  branches:
    - label: "权臣与实力人物（9人）"
      nodes:
        - label: "胡惟庸"
          role: "左丞相"
          note: "谋逆罪名有罗织争议,废中书省｜胡惟庸案"
        - label: "郑和"
          role: "宦官使者"
          note: "通使规模与动机多说并存｜七下西洋"
        - label: "王振"
          role: "司礼监太监"
          note: "怂恿亲征之说为主流记述,责任有争议｜土木堡之变"
        - label: "于谦"
          role: "兵部尚书"
          note: "后被杀,成化初复官赐谥｜北京保卫战"
        - label: "严嵩"
          role: "内阁首辅"
          note: "奸臣脸谱多出后世演绎,引用须谨慎｜嘉靖专权"
        - label: "张居正"
          role: "内阁首辅"
          note: "身后被清算,评价两极｜万历新政、一条鞭法"
        - label: "魏忠贤"
          role: "司礼监秉笔太监"
          note: "《明史·阉党传》笔法有争议｜天启专权、东林党争"
        - label: "东林党人"
          role: "士人政治群体"
          note: "以顾宪成、高攀龙、杨涟等为代表,人物众多不一一系年｜东林党争"
        - label: "袁崇焕"
          role: "辽东经略"
          note: "功罪评价争议极大,此处不下结论｜宁远之战、平台被杀"

phases:
  - id: founding
    label: 开国
    years: 1368年~1398年
    intro: 朱元璋由红巾将领而建明，洪武制度是明朝的骨架：废丞相、设六部、卫所制、里甲制，中央集权的程度超过前代。本章读洪武开国制度条。
  - id: golden
    label: 盛世
    years: 1403年~1505年
    intro: 永乐迁都、郑和下西洋、仁宣之治与弘治中兴，是明朝的鼎盛。建文帝下落传说放在本章作对照：永乐朝的阴影，恰恰是盛世叙事之外的另一面。
    note: 土木堡之变在1449年，时间上插在仁宣弘治之间，按转折归入衰败章，通读时请注意时间交错。
  - id: decline
    label: 衰败
    years: 1449年~1619年
    intro: 土木堡之变是明朝由盛转衰的转折，北京保卫战守住了都城、守不住颓势；张居正改革与一条鞭法是衰败中的回光，万历援朝耗尽国力、萨尔浒之战败于后金，衰败至此不可逆转。
  - id: fall
    label: 灭亡
    years: 1628年~1644年
    intro: 崇祯朝内有农民起义、外有后金压境，1644年李自成克北京、崇祯自缢煤山，明亡。煤山结局传说放在本章作对照，正史与传说要分开看。

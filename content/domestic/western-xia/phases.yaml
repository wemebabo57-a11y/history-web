phases:
  - id: founding
    label: 开国
    years: 1032年~1038年
    intro: 李元昊在党项故地称帝建夏，国号大夏，定都兴庆府，西夏正式立国。此前党项在宋辽之间已经营数十年，称帝只是立国的最后一步。
  - id: golden
    label: 盛世
    years: 1040年~1044年
    intro: 西夏的鼎盛短暂，本章以宋夏庆历和约为相对高点：三川口、好水川、定川寨三战之后，宋夏达成和约，西夏获得岁赐，边境暂安。凉州词与西夏边塞传说放在本章作风貌对照。
    note: 西夏无长期盛世，本章以和约后的稳定为相对高点。
  - id: decline
    label: 衰败
    years: 1067年~1099年
    intro: 梁氏专权三十余年，宋夏再战，永乐城之战宋军大败、西夏亦大耗国力。本章是本次新增的补缺条目，补上了原来只有建夏、和约与灭夏、没有中后期过程的缺口。
  - id: fall
    label: 灭亡
    years: 1205年~1227年
    intro: 蒙古连年侵夏，西夏国力耗竭，1227年蒙古灭西夏，末主李睍出降，西夏亡，成吉思汗亦死于灭夏途中。

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜索 | 历史全集</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script></head><body><div class="wrap"><header class="top"><div class="crumb"><a href="index.html">首页</a> / 搜索</div><h1>搜索</h1></header><input id="q" placeholder="输入关键词" style="width:260px;padding:8px"> <div id="r"></div><script>fetch('search-index.json').then(function(x){return x.json();}).then(function(IDX){function go(){var q=document.getElementById('q').value;var r=IDX.filter(function(e){return !q||e.text.indexOf(q)>-1||e.title.indexOf(q)>-1;});document.getElementById('r').innerHTML=r.slice(0,200).map(function(e){return '<p><a href="entry-'+e.id+'.html">'+e.title+'</a> '+e.gname+'/'+e.stype+'</p>';}).join('')+'<p>命中 '+r.length+' 条</p>';}document.getElementById('q').oninput=go;go();});</script><footer>历史全集静态站 · 零依赖构建 · 史料均注来源版本定位，未核验处标“页码待核/未能联网核验”；演绎与史料严格区分；疆域图为自绘示意非精确测绘，禁套现代边界；官方图待用户提供后替换。</footer><script>if(window.mermaid){mermaid.initialize({startOnLoad:true});}</script></div></body></html>

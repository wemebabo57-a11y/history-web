<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-label="两晋疆域示意,非精确地图">
<title>两晋疆域示意(西晋统一与永嘉南渡后)</title>
<desc>自绘示意:西晋统一轮廓叠加永嘉后南北分色,都城洛阳建康,禁套现代边界,CC0</desc>
<rect width="720" height="520" fill="#cfe3f2"/>
<text x="648" y="300" font-size="13" fill="#3a6d96" text-anchor="middle">东海</text>
<text x="648" y="318" font-size="11" fill="#3a6d96" text-anchor="middle">(示意)</text>
<text x="330" y="470" font-size="13" fill="#3a6d96" text-anchor="middle">南海(示意)</text>
<polygon points="120,80 300,55 430,60 520,100 560,160 600,220 620,300 590,360 520,420 400,460 250,440 150,380 110,280 100,180" fill="#f2ecdd" stroke="#8a7d5c" stroke-width="2"/>
<text x="150" y="130" font-size="11" fill="#8a7d5c">陆地(示意)</text>
<text x="60" y="250" font-size="11" fill="#3a6d96">海洋(示意)</text>

  <polygon points="150,120 320,95 500,100 560,180 560,330 500,410 300,430 150,380 110,250" fill="#e8c97a" opacity="0.9" stroke="#7d5a00" stroke-width="2.5"/>
  <text x="300" y="150" font-size="13" font-weight="bold" fill="#5c430a">西晋极盛统一轮廓(约280)</text>
  <polygon points="118,300 300,296 450,290 575,285 585,340 510,405 300,425 160,378 118,330" fill="#7fb069" opacity="0.55" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="150,120 320,95 500,100 560,180 575,285 450,290 300,296 118,300 110,250" fill="#c97b7b" opacity="0.45" stroke="#7b241c" stroke-width="1.5" stroke-dasharray="6 3"/>
  <line x1="118" y1="298" x2="580" y2="286" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="430" y="278" font-size="11" fill="#7b241c">淮河一线分治(示意)</text>
  <text x="330" y="370" font-size="14" font-weight="bold" fill="#1b4332">南:东晋(都建康)</text>
  <text x="300" y="240" font-size="13" font-weight="bold" fill="#641e16">北:诸政权并立(五胡十六国前夕)</text>
<path d="M130,190 C200,170 240,200 300,195 C360,190 380,220 430,215 C480,210 520,190 565,200" fill="none" stroke="#2f80ed" stroke-width="3"/>
<text x="470" y="200" font-size="12" fill="#1a5fb4">黄河(示意)</text>
<path d="M130,320 C220,308 300,325 380,310 C450,298 520,305 595,290" fill="none" stroke="#2f80ed" stroke-width="3.5"/>
<text x="480" y="325" font-size="12" fill="#1a5fb4">长江(示意)</text>

  <circle cx="375" cy="228" r="5" fill="#111" stroke="#fff" stroke-width="1.5"/><text x="384" y="232" font-size="12" font-weight="bold" text-anchor="start">洛阳·西晋都</text>
  <circle cx="525" cy="300" r="5" fill="#111" stroke="#fff" stroke-width="1.5"/><text x="516" y="304" font-size="12" font-weight="bold" text-anchor="end">建康·东晋都</text>
  <g><line x1="375" y1="235" x2="480" y2="285" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="none"/>
  <text x="392" y="268" font-size="11" fill="#333">永嘉南渡(311前后·示意)</text></g>

  <g transform="translate(664,56)" aria-label="指南针">
    <circle r="22" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <polygon points="0,-16 6,6 0,2 -6,6" fill="#c0392b"/>
    <text y="-26" text-anchor="middle" font-size="13" font-weight="bold">N</text>
    <text y="4" text-anchor="middle" font-size="9">北</text>
  </g>
  <g transform="translate(24,478)" aria-label="比例尺示意">
    <rect x="0" y="0" width="120" height="7" fill="#fff" stroke="#333"/>
    <rect x="0" y="0" width="60" height="7" fill="#333"/>
    <text x="0" y="20" font-size="10">0</text>
    <text x="52" y="20" font-size="10">500</text>
    <text x="100" y="20" font-size="10">1000km</text>
    <text x="150" y="12" font-size="10" fill="#555">比例尺示意·非精确</text>
  </g><text x="360" y="512" text-anchor="middle" font-size="10" fill="#555">自绘示意·CC0·禁套现代国界省界海岸线·不作精确疆界与比例依据</text>
<rect x="8" y="8" width="420" height="58" rx="6" fill="#fff" opacity="0.92" stroke="#333"/>
<text x="20" y="31" font-size="16" font-weight="bold">两晋疆域示意(西晋统一与永嘉南渡后)</text>
<text x="20" y="50" font-size="11" fill="#555">土黄=西晋极盛统一 · 虚线=永嘉后南北分治 · 自绘示意非精确</text>
<g transform="translate(8,430)" aria-label="图例">
<rect x="0" y="0" width="300" height="40" rx="5" fill="#fff" opacity="0.94" stroke="#666"/>
<rect x="10" y="10" width="16" height="12" fill="#e8c97a" stroke="#7d5a00"/><text x="30" y="20" font-size="11">西晋统一</text>
  <rect x="115" y="10" width="16" height="12" fill="#7fb069" stroke="#2d6a4f"/><text x="135" y="20" font-size="11">南(晋)</text>
  <rect x="185" y="10" width="16" height="12" fill="#c97b7b" stroke="#7b241c"/><text x="205" y="20" font-size="11">北(诸政权)</text></g>
</svg>
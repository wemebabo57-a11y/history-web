<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
<rect width="600" height="400" fill="#f7f3e8"/>
<text x="20" y="30" font-size="16">Tang疆域文字示意图(示意非精确)</text>
<rect x="100" y="80" width="400" height="220" fill="#e3d9bd" stroke="#8a7a4d"/>
<text x="220" y="180" font-size="14">长安洛阳核心(示意)</text>
<text x="120" y="110" font-size="12">北:漠北羁縻(有起伏)</text>
<text x="120" y="280" font-size="12">南:安南(示意)</text>
<text x="440" y="160" font-size="12">东:安东(存争议)</text>
<text x="110" y="160" font-size="12">西:安西四镇(得失)</text>
<text x="20" y="370" font-size="12">注:极盛与中晚期差异大,仅文字示意.</text>

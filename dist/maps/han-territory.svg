<text x="360" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#2c2c2c">两汉疆域示意（自绘，非精确测绘）</text>
<text x="360" y="505" font-size="12" text-anchor="middle" fill="#333">CC0 自绘示意 · 不套用现代省界国界 · 四至见 dynasty.md 文字 · 示意非实测</text>

<path d="M 150,235 L 230,210 L 330,190 L 430,192 L 495,220 L 510,258 L 460,300 L 415,345 L 320,360 L 235,330 L 175,285 Z" fill="#cfa14f" fill-opacity="0.78" stroke="#7a4a12" stroke-width="2.5"/>

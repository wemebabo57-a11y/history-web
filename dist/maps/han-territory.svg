<text x="340" y="298" font-size="12" fill="#5a2d0c" text-anchor="middle">西汉盛期含河西 · 东汉相埒 · 非精确</text>
<!-- 黄河 -->
<path d="M 165,140 C 225,155 255,170 245,205 C 237,238 295,252 345,240 C 395,228 450,232 510,252" fill="none" stroke="#4a90c2" stroke-width="3"/>
<text x="485" y="230" font-size="12" fill="#2f6b9a">黄河（示意）</text>

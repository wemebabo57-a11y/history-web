<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-label="两汉疆域示意图">
<title>两汉疆域示意（自绘，非精确测绘）</title>
<desc>自绘示意：海洋/陆地底色、黄河长江曲线、两汉疆域多边形、邻族方位、长安洛阳、西域都护方向虚线、指南针、比例尺示意。禁套现代省界国界，不作精确声称。</desc>
<rect x="0" y="0" width="720" height="540" fill="#cfe3f2"/>

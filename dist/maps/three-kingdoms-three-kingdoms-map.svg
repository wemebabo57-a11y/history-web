<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" role="img" aria-label="三国疆域文字示意,非精确地图"><rect width="640" height="360" fill="#f7f5ef"/><text x="20" y="30" font-size="16">三国鼎立文字示意(非精确,不作边界依据)</text><rect x="40" y="60" width="560" height="240" fill="none" stroke="#999"/><text x="60" y="110" font-size="14">北:曹魏(约黄河流域,都洛阳)</text><text x="60" y="180" font-size="14">西:蜀汉(约四川盆地,都成都)</text><text x="60" y="250" font-size="14">东:孙吴(约江东,都建业)</text></svg>